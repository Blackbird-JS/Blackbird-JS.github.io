<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to BlackbirdJS...</title>
  <script type="text/javascript">
    // Store the exact broken path the user tried to access directly
    var pathSegmentsToKeep = window.location.pathname;

    // Redirect immediately back to the main index.html file with a query tracker
    window.location.replace(
      window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + '?p=' + encodeURIComponent(pathSegmentsToKeep)
    );
  </script>
</head>
<body>
</body>
</html>
